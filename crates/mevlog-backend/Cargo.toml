[package]
name = "mevlog-backend"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
uuid = { version = "1.11.0", features = ["v4"] }
eyre = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing = { workspace = true }
tracing-futures = "0.2"
tower-http = { version = "0.6.2", features = [
  "fs",
  "trace",
  "timeout",
  "compression-gzip",
  "compression-br",
  "compression-deflate",
  "catch-panic",
  "set-header",
] }
tower = "0.5.2"
axum = { workspace = true }
askama = "0.12.1"
regex = { workspace = true }
hotpath = { git = "https://github.com/pawurb/hotpath-rs", branch = "main", features = ["axum-0-8", "tokio"] }

[dev-dependencies]
http-body-util = "0.1.2"

[[bin]]
name = "server"
path = "bin/server.rs"

[[bin]]
name = "clean-html-links"
path = "bin/clean-html-links.rs"

[package.metadata.askama]
template-dir = "templates"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc= ["hotpath/hotpath-alloc"]
hotpath-meta = ["hotpath/hotpath-meta"]
