---
# The scheduler (live mainnet indexer + reindex/purge cron jobs) was removed.
# Stop, disable and delete its unit on hosts that still have it.
- name: Stop and disable retired mevlog-scheduler
  systemd:
    name: mevlog-scheduler
    state: stopped
    enabled: no
  failed_when: false

- name: Remove retired mevlog-scheduler unit
  file:
    path: /etc/systemd/system/mevlog-scheduler.service
    state: absent
  register: mevlog_scheduler_unit

- name: Remove retired scheduler binary
  file:
    path: /root/mevlog-backend/scheduler
    state: absent

- name: Install mevlog systemd units
  copy:
    src: mevlog-server.service
    dest: /etc/systemd/system/mevlog-server.service
    owner: root
    group: root
    mode: '0644'
  register: mevlog_units

- name: Reload systemd if units changed
  systemd:
    daemon_reload: yes
  when: mevlog_units.changed or mevlog_scheduler_unit.changed

# Enable only (boot start). Actual start/restart is done by remote/restart.sh
# after deploy.sh has put the binary and .env in place.
- name: Enable mevlog-server
  systemd:
    name: mevlog-server
    enabled: yes
